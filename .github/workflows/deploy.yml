name: deploy.yml
'on':
  push:
    branches: [ master ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Créer l'évènement de déploiement
        id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const message = context.payload.head_commit?.message ?? '';
            const hotfix = message.match(/from [^/]+\/(hotfix\/\S+)/);
            const deploymentRef = hotfix ? hotfix[1] : context.sha;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: deploymentRef,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
            });

            return deployment.data.id;

      - name: Déploiement fictif
        run: echo "déploiement"

      - name: Marquer le déploiement comme réussi
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              environment: 'production',
            });